name: issue-labeler

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 手動実行時にラベル付与対象とする Issue 番号
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Ensure bug label from title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const inputIssueNumber = core.getInput('issue-number');
            const issueNumber = inputIssueNumber ? Number(inputIssueNumber) : context.issue?.number;
            if (!issueNumber) {
              core.info('Issue number not available; skipping title-based labeling');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const hasBugLabel = issue.labels.some(label => (typeof label === 'string' ? label : label.name) === 'type:bug');
            if (/^\[Bug\]/i.test(issue.title) && !hasBugLabel) {
              core.info(`Adding type:bug label to issue #${issueNumber} based on title prefix`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['type:bug'],
              });
            }
      - name: Apply labels (issue event)
        if: github.event_name == 'issues'
        uses: github/issue-labeler@v3.4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/issue-labeler.yml
          include-title: 1
          not-before: '2025-11-24T00:00:00Z'
          enable-versioned-regex: 0
      - name: Apply labels (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: github/issue-labeler@v3.4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/issue-labeler.yml
          issue-number: ${{ inputs.issue-number }}
          include-title: 1
          not-before: '2025-11-24T00:00:00Z'
          enable-versioned-regex: 0
