# Issue body / title に基づく自動ラベル設定
type:bug:
  - '/(\\[Bug\\]|不具合|バグ|エラー|例外|障害|異常|落ちる|クラッシュ|stack trace|bugfix|hotfix|failure|crash|動作しない|不正|想定外)/i'
type:enhancement:
  - '/(\\[Feature\\]|改善|機能追加|追加|強化|拡張|要望|提案|整備|実装|導入|最適化|アップデート|enhancement|feature|improve|update|refactor)/i'
type:docs:
  - '/(docs\\/|ドキュメント)/i'
area:docs:
  - '/(docs\\/|README(\\.md)?)/i'
area:templates:
  - '/(テンプレ|テンプレート|branding|generate_ready|template|templates\\/|samples\\/templates\\/|branding\\.json|template_spec|template_ai|layout_ai|jobspec\\.meta\\.template_path)/i'
area:automation:
  - '/(\\.github|workflow|actions?)/i'
area:llm:
  - '/(llm|プロンプト|prompt|directive|指示文|推論設定|モデル|model|Template\\s*AI|テンプレ\\s*AI|template\\s*ai|Layout\\s*AI|レイアウト\\s*AI|layout\\s*ai|openai|azure\\s*openai|anthropic|claude|bedrock|gpt)/i'
area:cli:
  - '/(CLI\\b|CLIツール|コマンド|uv\\s+run|pptx\\s+(compose|mapping|gen|prepare|tpl-extract|schedule)|--output|--workdir|引数)/i'
area:dotnet:
  - '/\.NET/'
  - '/Polisher/'
