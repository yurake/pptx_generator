[project]
name = "pptx-generator"
version = "0.1.0"
description = "JSON 仕様から提案書 PPTX を生成するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "click>=8.1,<9",
    "python-pptx>=0.6.21",
    "pyyaml>=6,<7",
    "jsonschema>=4.22,<5",
    "deepdiff>=7,<8",
    "python-dotenv>=1.0,<2",
    "gunicorn>=21,<22",
    "openai>=2.6.1",
    "boto3>=1.40.64",
    "anthropic>=0.72.0",
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-xdist>=3.5,<4",
    "httpx>=0.27,<1",
]

[tool.coverage.run]
source = ["src"]
relative_files = true

[tool.coverage.report]
exclude_also = ["^\\s*if __name__ == ['\"]__main__['\"]:"]

[project.scripts]
pptx = "pptx_generator.cli:app"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=xml -n auto"
markers = [
    "integration: 統合テストに分類されるケース",
    "serial: 並列実行を避けるテスト",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pptx_generator.config" = ["*.json", "ai_policies/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
