openapi: 3.1.0
info:
  title: PPTX Generator Edit API
  version: 0.1.0
  description: |
    Stage5 (edit) 専用の最小構成 OpenAPI。
    認証は HMAC 署名と Bearer の OR で許可する。
servers:
  - url: http://localhost:8000
    description: Local dev
security:
  - HmacAuth: []
  - BearerAuth: []
paths:
  /health:
    get:
      summary: ヘルスチェック
      description: 稼働確認用のシンプルなヘルスチェック。認証不要。
      security: []  # public endpoint
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /edit:
    post:
      summary: Stage5 edit のジョブ登録
      description: 生成済み PPTX に差分を適用し、書式を保持したままテキストを置換するジョブを登録する。`edits_json` 未指定時は LLM で差分を自動生成する。
      security:
        - HmacAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRequest"
      responses:
        "202":
          description: ジョブ受付
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobHandle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /jobs/{job_id}:
    get:
      summary: ジョブステータスと成果物取得
      description: 任意ステージのジョブ状態を返却する。edit 完了時は成果物 URL を含む。
      security:
        - HmacAuth: []
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ジョブ状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/artifacts/{artifact_type}:
    get:
      summary: 生成された成果物をダウンロードする
      description: pptx または pdf を認証付きで返却する。
      security:
        - HmacAuth: []
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_type
          in: path
          required: true
          schema:
            type: string
            enum: [pptx, pdf]
      responses:
        "200":
          description: 成功時は成果物をバイナリで返却
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /transactions/{transaction_id}:
    get:
      summary: トランザクション単位のジョブ一覧
      description: transaction_id 配下のジョブ概要を返却する。
      security:
        - HmacAuth: []
        - BearerAuth: []
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: トランザクションのジョブ一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    HmacAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 署名。ヘッダに `X-Signature` と `X-Timestamp`（epoch秒）を送信する。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobHandle:
      type: object
      required:
        - job_id
        - transaction_id
        - status
        - stage
      properties:
        job_id:
          type: string
        transaction_id:
          type: string
          description: 同じリクエスト系列をまとめる追跡用 ID。指定なしの場合はサーバが払い出す。
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled]
        stage:
          type: string
          enum: [edit]
        status_url:
          type: string
          format: uri
        transaction_url:
          type: string
          format: uri
    JobStatus:
      allOf:
        - $ref: "#/components/schemas/JobHandle"
        - type: object
          properties:
            artifacts:
              $ref: "#/components/schemas/ArtifactLinks"
            error:
              $ref: "#/components/schemas/ErrorResponse"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            started_at:
              type: string
              format: date-time
            finished_at:
              type: string
              format: date-time
    TransactionStatus:
      type: object
      required:
        - transaction_id
        - jobs
      properties:
        transaction_id:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobHandle"
    EditRequest:
      type: object
      required:
        - pptx_path
      properties:
        transaction_id:
          type: string
          description: トランザクションID。省略時はサーバが付与。
        pptx_path:
          type: string
          description: 差分適用対象の PPTX パス（サーバ上パス）
        edits_json:
          type: string
          description: 差分 JSON ファイルパス（サーバ上パス）。指定時は LLM を呼ばず適用のみ。
        edits:
          type: array
          description: 差分定義を直接指定。`edits_json` より優先。
          items:
            $ref: "#/components/schemas/EditItem"
        output:
          type: string
          description: 出力先 PPTX パス。省略時は `PPTX_OUTPUT_ROOT/<tx>/edit/<job_id>/<元ファイル名>`。
    EditItem:
      type: object
      required:
        - shape_id
        - contents
      properties:
        shape_id:
          type: integer
        slide_index:
          type: integer
          description: 0-based スライド番号。未指定時は shape_id のみで照合。
        name:
          type: string
        edit:
          type: boolean
          default: true
        contents:
          type: string
    ArtifactLinks:
      type: object
      properties:
        pptx_url:
          type: string
          format: uri
          description: /jobs/{job_id}/artifacts/pptx に相当する URL。
        pdf_url:
          type: string
          format: uri
          description: /jobs/{job_id}/artifacts/pdf に相当する URL（PDF を生成した場合のみ）。
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: 不正な入力
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: リクエストボディが上限を超過
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 認可エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: 入力検証エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
